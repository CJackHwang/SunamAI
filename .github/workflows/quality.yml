name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # e2e 全量（18 spec）+ 前面 10 步门禁实测需 20-25 分钟；15 分钟曾导致 test:e2e 被 job 超时取消。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # V1 H1-3：sync 在无 WebUnix 检出的 CI 不再静默跳过 —— npm ci 已装 @succinix/engine，
      # 从这里取 host.js + lifo-core.js（本地 WebUnix 缺失时）；两者都缺则显式失败。
      - run: node scripts/sync-succinix-assets.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # V1 H1-3：真实 WebContainer 链路门禁 —— 此前 test:runtime 从未被 CI 拦截，
  # 容器链回归无人看管。独立 job 跑真实 WC 运行时测试（test:runtime 内部自行 build+preview，
  # prebuild 会经 sync 拉取 @succinix/engine 资产），网络允许时执行。
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-runtime-report
          path: |
            playwright-report
            test-results
